<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Check tomato leaf photos and get sourced crop guidance.">
  <title>JRV Crop Health</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <strong>JRV <span>Crop Health</span></strong>
    <select id="language" aria-label="Language / भाषा">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
    </select>
  </header>
  <main>
    <section class="intro">
      <p class="crop" data-copy="crop">Tomato leaf check</p>
      <h1 data-copy="title">What’s happening to your crop?</h1>
      <p data-copy="subtitle">Upload a tomato leaf photo to check for signs of early blight and find out what to do next.</p>
    </section>
    <div class="workspace">
      <section class="panel">
        <h2 data-copy="photo">Leaf photo</h2>
        <form id="scan">
          <label class="upload" for="image">
            <img id="preview" alt="" hidden>
            <span id="placeholder" aria-hidden="true">＋</span>
            <span data-copy="choose">Choose a photo</span>
          </label>
          <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
          <p class="hint" data-copy="hint">Use daylight and keep one leaf in focus. JPEG, PNG or WebP, up to 8 MB.</p>
          <p class="hint" id="connection" role="status"></p>
          <button class="primary" id="analyze" disabled data-copy="analyze">Analyze photo</button>
        </form>
        <div class="examples">
          <p data-copy="examples">Preview example results</p>
          <button type="button" data-example="early_blight" data-copy="sampleBlight">Possible early blight</button>
          <button type="button" data-example="uncertain" data-copy="sampleUncertain">Unclear photo</button>
        </div>
      </section>
      <section class="panel result" aria-live="polite">
        <h2 data-copy="result">Result</h2>
        <div id="output"></div>
      </section>
    </div>
  </main>
</body>
</html>
